server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy — same-origin. The React app calls /api/... with relative
    # paths, so nginx forwards them to the backend compose service (fixed
    # internal port 3000); no CORS needed. The path is passed through
    # unchanged (proxy_pass without a URI part).
    location /api/ {
        proxy_pass http://backend:3000;
    }

    # Static assets — RESERVED PREFIX. This location serves Vite's immutable
    # hashed-bundle output and hard-404s anything missing. Never route an SPA
    # page at or under /assets/.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side routing owns all other paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
