# dashhome — two-service Docker Compose stack.
#
#   backend  — the Go API (root Dockerfile). Listens on a fixed internal
#              port 3000; the dashboard no longer ships in this image.
#   frontend — nginx serving the built React app (frontend/Dockerfile).
#              Listens on 8000 in the container and proxies /api/ to the
#              backend same-origin, so the React app keeps calling
#              relative /api/... paths with no CORS.
#
# .env (see .env.example) is read twice:
#   1. by Docker Compose itself, for the ${VAR} substitutions below;
#   2. via env_file, to pass the app's environment variables into the
#      backend container.
#
# The dashboard is published on ${FRONTEND_PORT} (default 8000); the API
# on ${BACKEND_PORT} (default 3000). Set BACKEND_PORT / FRONTEND_PORT in
# .env to move the host ports (the container-side ports stay 3000/8000).
# No credentials are stored here — they come from .env and are never
# baked into the images. The Google service-account key (Mode A) is the
# one exception to "in .env": it is a file, bind-mounted read-only from
# ./backend/.keys (gitignored) into the backend container, so it never
# lands in an image layer either.

name: dashhome

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: dashhome-backend:latest
    env_file:
      - path: .env
        required: false
    environment:
      # Fixed internal listen port. This overrides PORT from .env so the
      # container port stays 3000 no matter what .env says.
      PORT: "3000"
    ports:
      # ${BACKEND_PORT:-3000} — host port for the API (compose reads .env).
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      # Durable state (Hermes push records, Google token cache).
      - data:/app/data
      # Google service-account key (Mode A), read-only. The container
      # WORKDIR is /app, so the .env value ./backend/.keys/<key>.json
      # resolves to this mount. Host file must be world-readable (the
      # container runs as the non-root dashhome user).
      - ./backend/.keys:/app/backend/.keys:ro
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: dashhome-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # ${FRONTEND_PORT:-8000} — host port for the dashboard.
      - "${FRONTEND_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  data:
